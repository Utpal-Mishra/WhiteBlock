services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: whiteblock-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whiteblock}
      POSTGRES_USER: ${POSTGRES_USER:-whiteblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whiteblock_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - whiteblock_postgis_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whiteblock} -d ${POSTGRES_DB:-whiteblock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: whiteblock-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-whiteblock}:${POSTGRES_PASSWORD:-whiteblock_dev}@postgis:5432/${POSTGRES_DB:-whiteblock}
      WHITEBLOCK_CORS_ORIGINS: ${WHITEBLOCK_CORS_ORIGINS:-https://utpal-mishra.github.io,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  whiteblock_postgis_data:

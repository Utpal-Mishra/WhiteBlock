name: Deploy WHITEBLOCK to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/ingest_cork_parking.py"
      - "scripts/export_web_snapshot.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest Cork parking snapshot
        run: |
          python scripts/ingest_cork_parking.py --output-dir data/cork
          python scripts/export_web_snapshot.py --input-dir data/cork --output web/data/parking_snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("web/data/parking_snapshot.json")
          data = json.loads(path.read_text())
          locations = data.get("locations", [])
          if not locations:
              raise SystemExit("Parking snapshot contains no locations; refusing to deploy misleading empty data")
          print(f"Validated browser snapshot with {len(locations)} locations")
          PY

      - name: Configure optional WHITEBLOCK API
        env:
          WHITEBLOCK_API_BASE_URL: ${{ vars.WHITEBLOCK_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.getenv("WHITEBLOCK_API_BASE_URL", "").strip().rstrip("/") or None
          config = {"apiBaseUrl": value}
          Path("web/runtime-config.js").write_text(
              "window.WHITEBLOCK_CONFIG = " + json.dumps(config, separators=(",", ":")) + ";\n",
              encoding="utf-8",
          )
          print("WHITEBLOCK API mode:", "configured" if value else "snapshot fallback")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WHITEBLOCK web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

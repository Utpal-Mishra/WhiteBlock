name: Deploy WHITEBLOCK to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/ingest_cork_parking.py"
      - "scripts/export_web_snapshot.py"
      - "scripts/ingest_kildare_parking.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current Cork and Kildare parking snapshots
        run: |
          python scripts/ingest_cork_parking.py --output-dir data/cork
          python scripts/export_web_snapshot.py --input-dir data/cork --output web/data/parking_snapshot.json
          python scripts/ingest_kildare_parking.py --output web/data/kildare_parking_snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("Cork", Path("web/data/parking_snapshot.json")),
              ("Kildare", Path("web/data/kildare_parking_snapshot.json")),
          ]
          for region, path in checks:
              data = json.loads(path.read_text())
              locations = data.get("locations", [])
              if not locations:
                  raise SystemExit(f"{region} parking snapshot contains no locations; refusing to deploy misleading empty data")
              print(f"Validated {region} browser snapshot with {len(locations)} locations")
          PY

      - name: Configure optional WHITEBLOCK API and UI loaders
        env:
          WHITEBLOCK_API_BASE_URL: ${{ vars.WHITEBLOCK_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.getenv("WHITEBLOCK_API_BASE_URL", "").strip().rstrip("/") or None
          config = {"apiBaseUrl": value}
          runtime = "window.WHITEBLOCK_CONFIG = " + json.dumps(config, separators=(",", ":")) + ";\n"
          runtime += r'''
(() => {
  if (!document.querySelector('link[data-whiteblock-session-controls]')) {
    const style = document.createElement('link');
    style.rel = 'stylesheet';
    style.href = './session-controls.css?v=20260917-1';
    style.dataset.whiteblockSessionControls = 'true';
    document.head.appendChild(style);
  }
  if (!document.querySelector('script[data-whiteblock-session-controls]')) {
    const script = document.createElement('script');
    script.src = './session-controls.js?v=20260917-1';
    script.async = false;
    script.dataset.whiteblockSessionControls = 'true';
    document.body.appendChild(script);
  }
})();
window.addEventListener('DOMContentLoaded', () => {
  if (document.querySelector('script[data-whiteblock-region-network]')) return;
  const script = document.createElement('script');
  script.src = './region-network.js?v=20260919-kildare1';
  script.defer = true;
  script.dataset.whiteblockRegionNetwork = 'true';
  document.body.appendChild(script);
});
'''
          Path("web/runtime-config.js").write_text(runtime, encoding="utf-8")
          print("WHITEBLOCK API mode:", "configured" if value else "snapshot fallback")
          print("WHITEBLOCK regional loader: Cork + Kildare")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WHITEBLOCK web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

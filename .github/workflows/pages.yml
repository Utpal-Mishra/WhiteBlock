name: Deploy WHITEBLOCK to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/ingest_cork_parking.py"
      - "scripts/ingest_cork_county_parking.py"
      - "scripts/ingest_cork_county_parking_stable.py"
      - "scripts/export_web_snapshot.py"
      - "scripts/ingest_kildare_parking.py"
      - "scripts/ingest_kildare_county_parking.py"
      - "scripts/ingest_kildare_county_parking_stable.py"
      - "scripts/enrich_kildare_snapshot.py"
      - "scripts/finalize_kildare_county_snapshot.py"
      - "scripts/ingest_dublin_county_parking.py"
      - "scripts/ingest_dublin_county_parking_stable.py"
      - "scripts/build_dublin_coverage_ledger.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cork City is still refreshed when the upstream source responds, but a
      # temporary source outage must not block publication of validated Dublin
      # evidence. If refresh fails we retain the last published Cork snapshot
      # when one is reachable; otherwise the browser exposes Cork as unavailable.
      - name: Refresh Cork City snapshot without gating Dublin
        run: |
          rm -f web/data/parking_snapshot.json
          if python scripts/ingest_cork_parking.py --output-dir data/cork \
            && python scripts/export_web_snapshot.py --input-dir data/cork --output web/data/parking_snapshot.json; then
            echo "Cork City live snapshot refreshed"
          else
            echo "::warning::Cork City upstream feed unavailable; attempting last published snapshot"
            rm -f web/data/parking_snapshot.json
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://utpal-mishra.github.io/WhiteBlock/data/parking_snapshot.json" \
              --output web/data/parking_snapshot.json; then
              echo "Reused last published Cork City snapshot"
            else
              echo "::warning::No Cork City fallback snapshot available; Dublin publication will continue"
              rm -f web/data/parking_snapshot.json
            fi
          fi

      # Publishing and evidence refresh are deliberately separated. The Dublin
      # validation workflow can spend several minutes traversing exact authority
      # boundaries and may encounter transient Overpass 504/timeouts. Pages first
      # publishes the latest successful, precision-gated Dublin evidence artifact.
      # A live rebuild is retained only as a bootstrap fallback.
      - name: Acquire validated County Dublin network evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          rm -f \
            web/data/dublin_parking_snapshot.json \
            web/data/dublin_coverage_ledger.json \
            web/data/dublin_settlement_audit.json \
            web/data/dublin_restriction_audit.json \
            web/data/dublin_venue_knowledge.json

          RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dublin-coverage.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"

          ARTIFACT_READY=false
          if [[ -n "${RUN_ID}" ]]; then
            echo "Using latest successful Dublin validation run ${RUN_ID}"
            rm -rf /tmp/dublin-evidence
            mkdir -p /tmp/dublin-evidence
            if gh run download "${RUN_ID}" \
              -R "${GITHUB_REPOSITORY}" \
              -n county-dublin-parking-evidence \
              -D /tmp/dublin-evidence; then
              cp /tmp/dublin-evidence/dublin_*.json web/data/
              ARTIFACT_READY=true
            else
              echo "::warning::Validated Dublin artifact download failed; trying a live exact-boundary rebuild"
            fi
          else
            echo "::warning::No successful Dublin validation artifact found; trying a live exact-boundary rebuild"
          fi

          if [[ "${ARTIFACT_READY}" != "true" || ! -s web/data/dublin_parking_snapshot.json ]]; then
            python scripts/ingest_dublin_county_parking_stable.py --output web/data/dublin_parking_snapshot.json
            python scripts/build_dublin_coverage_ledger.py --input web/data/dublin_parking_snapshot.json --output web/data/dublin_coverage_ledger.json
          fi

          for required in \
            dublin_parking_snapshot.json \
            dublin_coverage_ledger.json \
            dublin_settlement_audit.json \
            dublin_restriction_audit.json \
            dublin_venue_knowledge.json; do
            test -s "web/data/${required}" || { echo "Missing required Dublin evidence file: ${required}"; exit 1; }
          done

      # County Cork and County Kildare remain useful connected regions, but their
      # external-source availability must not gate publication of a valid Dublin
      # network. Missing snapshots are handled explicitly by the browser adapters.
      - name: Build County Cork network snapshot
        run: |
          if python scripts/ingest_cork_county_parking_stable.py --output web/data/cork_county_parking_snapshot.json; then
            echo "County Cork network snapshot built"
          else
            echo "::warning::County Cork network snapshot unavailable; deploying without the optional county snapshot"
            rm -f web/data/cork_county_parking_snapshot.json
          fi

      - name: Build County Kildare network snapshot
        run: |
          if python scripts/ingest_kildare_county_parking_stable.py --output web/data/kildare_parking_snapshot.json \
            && python scripts/enrich_kildare_snapshot.py --input web/data/kildare_parking_snapshot.json \
            && python scripts/finalize_kildare_county_snapshot.py --input web/data/kildare_parking_snapshot.json; then
            echo "County Kildare network snapshot built"
          else
            echo "::warning::County Kildare network snapshot unavailable; deploying without the optional county snapshot"
            rm -f web/data/kildare_parking_snapshot.json
          fi

      - name: Validate regional snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dublin_path = Path("web/data/dublin_parking_snapshot.json")
          if not dublin_path.exists():
              raise SystemExit("County Dublin required parking snapshot is missing")
          dublin = json.loads(dublin_path.read_text())
          if not dublin.get("locations"):
              raise SystemExit("County Dublin parking snapshot contains no locations; refusing to deploy misleading empty data")
          print(f"Validated County Dublin browser snapshot with {len(dublin['locations'])} locations")

          cork_city_path = Path("web/data/parking_snapshot.json")
          if cork_city_path.exists():
              cork_city = json.loads(cork_city_path.read_text())
              cork_city_locations = cork_city.get("locations", [])
              if not cork_city_locations:
                  raise SystemExit("Cork City snapshot exists but contains no locations")
              print(f"Validated optional Cork City snapshot with {len(cork_city_locations)} locations")
          else:
              print("Cork City optional snapshot unavailable; browser will expose the source-unavailable state")

          cork_county_path = Path("web/data/cork_county_parking_snapshot.json")
          if cork_county_path.exists():
              cork_county = json.loads(cork_county_path.read_text())
              cork_locations = cork_county.get("locations", [])
              if not cork_locations:
                  raise SystemExit("County Cork snapshot exists but contains no locations")
              cork_polygon_count = cork_county.get("summary", {}).get("mapped_polygon_locations", 0) or 0
              if cork_polygon_count <= 0:
                  raise SystemExit("County Cork snapshot exists but contains no mapped parking polygons")
              print(f"Validated optional County Cork snapshot with {len(cork_locations)} locations / {cork_polygon_count} polygons")
          else:
              print("County Cork optional snapshot unavailable; browser will expose the source-unavailable state")

          kildare_path = Path("web/data/kildare_parking_snapshot.json")
          if kildare_path.exists():
              kildare = json.loads(kildare_path.read_text())
              kildare_locations = kildare.get("locations", [])
              if not kildare_locations:
                  raise SystemExit("County Kildare snapshot exists but contains no locations")
              kildare_summary = kildare.get("summary", {})
              kildare_coverage = kildare.get("coverage", {})
              kildare_osm = kildare.get("sources", {}).get("openstreetmap_kildare_parking", {})
              if kildare_coverage.get("scope") != "county_wide_network":
                  raise SystemExit("Kildare snapshot is not marked as complete county-wide coverage")
              if int(kildare_coverage.get("osm_boundary_relation_id") or 0) != 285833:
                  raise SystemExit("Kildare snapshot does not reference the canonical County Kildare OSM boundary")
              if kildare_osm.get("query_mode") != "exact_county_boundary" or kildare_osm.get("status") != "ok":
                  raise SystemExit("Kildare OSM inventory was not built from the exact county boundary")
              if int(kildare_osm.get("admin_level") or 0) != 6:
                  raise SystemExit("Kildare OSM inventory did not resolve the Irish county admin level")
              kildare_polygon_count = kildare_summary.get("mapped_polygon_locations", 0) or 0
              if kildare_polygon_count <= 0:
                  raise SystemExit("County Kildare snapshot contains no mapped parking polygons")

              ids = {item.get("parking_id") for item in kildare_locations}
              required = {
                  "WB-PARK-IE-KILDARE-KV-MAIN",
                  "WB-PARK-IE-KILDARE-MARKET-SQUARE",
                  "WB-PARK-IE-KILDARE-TOP-NOLAN",
              }
              missing = sorted(required - ids)
              if missing:
                  raise SystemExit("Critical Kildare parking anchors missing: " + ", ".join(missing))
              if not any((item.get("ev_spaces") or 0) > 0 for item in kildare_locations):
                  raise SystemExit("Kildare snapshot contains no EV-enabled parking")
              print(f"Validated optional County Kildare snapshot with {len(kildare_locations)} locations / {kildare_polygon_count} polygons")
          else:
              print("County Kildare optional snapshot unavailable; browser will expose the source-unavailable state")

          dublin_summary = dublin.get("summary", {})
          dublin_coverage = dublin.get("coverage", {})
          if dublin_coverage.get("scope") != "county_wide_network":
              raise SystemExit("Dublin snapshot is not marked as county-wide network coverage")
          if dublin_coverage.get("coverage_claim") != "complete_boundary_traversal_not_complete_real_world_inventory":
              raise SystemExit("Dublin snapshot is missing the mandatory precision/completeness disclaimer")
          if int(dublin_coverage.get("osm_traditional_county_relation_id") or 0) != 282800:
              raise SystemExit("Dublin snapshot does not reference the traditional County Dublin boundary provenance")

          expected_relations = {
              "Dublin City": 1109531,
              "Fingal": 1114164,
              "Dún Laoghaire–Rathdown": 1115720,
              "South Dublin": 1117469,
          }
          actual_relations = {
              key: int(value)
              for key, value in (dublin_coverage.get("local_authority_relation_ids") or {}).items()
          }
          if actual_relations != expected_relations:
              raise SystemExit(f"Dublin local-authority boundary set mismatch: {actual_relations!r}")

          authority_source_keys = {
              "Dublin City": "openstreetmap_dublin_city_parking",
              "Fingal": "openstreetmap_fingal_parking",
              "Dún Laoghaire–Rathdown": "openstreetmap_dun_laoghaire_rathdown_parking",
              "South Dublin": "openstreetmap_south_dublin_parking",
          }
          for authority, source_key in authority_source_keys.items():
              meta = dublin.get("sources", {}).get(source_key, {})
              if meta.get("status") != "ok" or meta.get("query_mode") != "exact_local_authority_boundary":
                  raise SystemExit(f"Dublin authority traversal failed validation for {authority}: {meta!r}")
              if int(meta.get("admin_level") or 0) != 7:
                  raise SystemExit(f"Dublin authority {authority} did not resolve at admin level 7")
              if int(meta.get("count") or 0) <= 0:
                  raise SystemExit(f"Dublin authority {authority} returned no mapped parking; refusing partial county deployment")

          dublin_locations = dublin.get("locations", [])
          if any(not item.get("local_authority") for item in dublin_locations):
              raise SystemExit("Dublin snapshot contains parking without local-authority provenance")
          if int(dublin_summary.get("mapped_polygon_locations") or 0) <= 0:
              raise SystemExit("Dublin snapshot contains no mapped parking polygons")
          if int(dublin_summary.get("settlement_labelled_locations") or 0) <= 0:
              raise SystemExit("Dublin snapshot contains no city/town/suburb/village labels")

          authority_counts = dublin_summary.get("locations_by_local_authority") or {}
          for authority in expected_relations:
              if int(authority_counts.get(authority) or 0) <= 0:
                  raise SystemExit(f"Dublin county build is missing parking inventory for {authority}")

          ledger_path = Path("web/data/dublin_coverage_ledger.json")
          if not ledger_path.exists():
              raise SystemExit("Dublin coverage ledger is missing")
          ledger = json.loads(ledger_path.read_text())
          ledger_summary = ledger.get("summary") or {}
          if int(ledger_summary.get("parking_assets") or 0) != len(dublin_locations):
              raise SystemExit("Dublin coverage ledger asset count does not match snapshot")
          if int(ledger_summary.get("local_authorities") or 0) != 4:
              raise SystemExit("Dublin coverage ledger does not contain all four local authorities")
          if int(ledger_summary.get("settlement_rows") or 0) <= 0:
              raise SystemExit("Dublin coverage ledger contains no city/town/suburb/village rows")

          settlement_audit = Path("web/data/dublin_settlement_audit.json")
          restriction_audit = Path("web/data/dublin_restriction_audit.json")
          venue_knowledge = Path("web/data/dublin_venue_knowledge.json")
          for sidecar in (settlement_audit, restriction_audit, venue_knowledge):
              if not sidecar.exists():
                  raise SystemExit(f"Required Dublin evidence sidecar missing: {sidecar.name}")

          print(
              "Validated County Dublin exact-boundary traversal:",
              dublin_summary.get("locations"), "locations /",
              dublin_summary.get("mapped_polygon_locations"), "polygons /",
              dublin_summary.get("settlement_labelled_locations"), "settlement-labelled /",
              ledger_summary.get("settlement_rows"), "coverage-ledger rows",
          )
          print("Dublin locations by local authority:", json.dumps(authority_counts, ensure_ascii=False))
          PY

      - name: Configure optional WHITEBLOCK API
        env:
          WHITEBLOCK_API_BASE_URL: ${{ vars.WHITEBLOCK_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = os.getenv("WHITEBLOCK_API_BASE_URL", "").strip().rstrip("/") or None
          path = Path("web/runtime-config.js")
          source = path.read_text(encoding="utf-8")
          replacement = "window.WHITEBLOCK_CONFIG = " + json.dumps({"apiBaseUrl": value}, separators=(",", ":")) + ";"
          source, count = re.subn(
              r"window\.WHITEBLOCK_CONFIG\s*=\s*window\.WHITEBLOCK_CONFIG\s*\|\|\s*\{\s*apiBaseUrl:\s*null\s*\};",
              replacement,
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not configure WHITEBLOCK runtime API block")
          path.write_text(source, encoding="utf-8")
          print("WHITEBLOCK API mode:", "configured" if value else "snapshot fallback")
          print("WHITEBLOCK regional loader: optional Cork City + optional County Cork + optional County Kildare + required validated County Dublin evidence snapshot")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WHITEBLOCK web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

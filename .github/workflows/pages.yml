name: Deploy WHITEBLOCK to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/ingest_cork_parking.py"
      - "scripts/ingest_cork_county_parking.py"
      - "scripts/export_web_snapshot.py"
      - "scripts/ingest_kildare_parking.py"
      - "scripts/enrich_kildare_snapshot.py"
      - "scripts/finalize_kildare_county_snapshot.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current Cork City, County Cork and County Kildare parking snapshots
        run: |
          python scripts/ingest_cork_parking.py --output-dir data/cork
          python scripts/export_web_snapshot.py --input-dir data/cork --output web/data/parking_snapshot.json
          python scripts/ingest_cork_county_parking.py --output web/data/cork_county_parking_snapshot.json
          python scripts/ingest_kildare_parking.py --output web/data/kildare_parking_snapshot.json
          python scripts/enrich_kildare_snapshot.py --input web/data/kildare_parking_snapshot.json
          python scripts/finalize_kildare_county_snapshot.py --input web/data/kildare_parking_snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("Cork City live", Path("web/data/parking_snapshot.json")),
              ("County Cork network", Path("web/data/cork_county_parking_snapshot.json")),
              ("County Kildare network", Path("web/data/kildare_parking_snapshot.json")),
          ]
          for region, path in checks:
              data = json.loads(path.read_text())
              locations = data.get("locations", [])
              if not locations:
                  raise SystemExit(f"{region} parking snapshot contains no locations; refusing to deploy misleading empty data")
              print(f"Validated {region} browser snapshot with {len(locations)} locations")

          cork_county = json.loads(Path("web/data/cork_county_parking_snapshot.json").read_text())
          cork_polygon_count = cork_county.get("summary", {}).get("mapped_polygon_locations", 0) or 0
          if cork_polygon_count <= 0:
              raise SystemExit("County Cork snapshot contains no mapped parking polygons; refusing degraded county deployment")
          print(f"Validated County Cork mapped geometry for {cork_polygon_count} parking locations")

          kildare = json.loads(Path("web/data/kildare_parking_snapshot.json").read_text())
          kildare_summary = kildare.get("summary", {})
          kildare_coverage = kildare.get("coverage", {})
          kildare_osm = kildare.get("sources", {}).get("openstreetmap_kildare_parking", {})
          if kildare_coverage.get("scope") != "county_wide_network":
              raise SystemExit("Kildare snapshot is not marked as complete county-wide coverage")
          if int(kildare_coverage.get("osm_boundary_relation_id") or 0) != 285833:
              raise SystemExit("Kildare snapshot does not reference the canonical County Kildare OSM boundary")
          if kildare_osm.get("query_mode") != "exact_county_boundary" or kildare_osm.get("status") != "ok":
              raise SystemExit("Kildare OSM inventory was not built from the exact county boundary")
          kildare_polygon_count = kildare_summary.get("mapped_polygon_locations", 0) or 0
          if kildare_polygon_count <= 0:
              raise SystemExit("County Kildare snapshot contains no mapped parking polygons; refusing degraded county deployment")
          print(f"Validated County Kildare mapped geometry for {kildare_polygon_count} parking locations")

          ids = {item.get("parking_id") for item in kildare.get("locations", [])}
          required = {
              "WB-PARK-IE-KILDARE-KV-MAIN",
              "WB-PARK-IE-KILDARE-MARKET-SQUARE",
              "WB-PARK-IE-KILDARE-TOP-NOLAN",
          }
          missing = sorted(required - ids)
          if missing:
              raise SystemExit("Critical Kildare parking anchors missing: " + ", ".join(missing))
          if not any((item.get("ev_spaces") or 0) > 0 for item in kildare.get("locations", [])):
              raise SystemExit("Kildare snapshot contains no EV-enabled parking; refusing degraded deployment")
          print("Validated critical Kildare Village/Town parking + EV coverage")
          PY

      - name: Configure optional WHITEBLOCK API
        env:
          WHITEBLOCK_API_BASE_URL: ${{ vars.WHITEBLOCK_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = os.getenv("WHITEBLOCK_API_BASE_URL", "").strip().rstrip("/") or None
          path = Path("web/runtime-config.js")
          source = path.read_text(encoding="utf-8")
          replacement = "window.WHITEBLOCK_CONFIG = " + json.dumps({"apiBaseUrl": value}, separators=(",", ":")) + ";"
          source, count = re.subn(
              r"window\.WHITEBLOCK_CONFIG\s*=\s*window\.WHITEBLOCK_CONFIG\s*\|\|\s*\{\s*apiBaseUrl:\s*null\s*\};",
              replacement,
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not configure WHITEBLOCK runtime API block")
          path.write_text(source, encoding="utf-8")
          print("WHITEBLOCK API mode:", "configured" if value else "snapshot fallback")
          print("WHITEBLOCK regional loader: Cork City live + County Cork network + complete County Kildare network")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WHITEBLOCK web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
